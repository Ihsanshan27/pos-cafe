version: '3.9'

services:
  # ─── PostgreSQL Database ───────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: pos_fnb_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pos_user
      POSTGRES_PASSWORD: pos_password
      POSTGRES_DB: pos_fnb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pos_user -d pos_fnb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── NestJS Backend ────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pos_fnb_backend
    restart: unless-stopped
    # Env vars di-inject langsung, tidak butuh file .env di dalam container
    environment:
      DATABASE_URL: postgresql://pos_user:pos_password@db:5432/pos_fnb
      PORT: 3000
      JWT_SECRET: pos-fnb-super-secret-jwt-key-2024
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules        # anonymous volume agar node_modules container tidak ditimpa

  # ─── Vite React Frontend ───────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pos_fnb_frontend
    restart: unless-stopped
    environment:
      # Jika perlu proxy ke backend di dalam Docker network
      VITE_API_URL: http://localhost:3000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
